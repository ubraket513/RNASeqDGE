# Historical P0 validation environment, not the supported compute runtime.
# Use runtime-r-linux-64.explicit.txt and the native tool bundle (see README).
name: rnaseqdge-p0
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pandas
  - biopython
  - loguru
  - biomart
  - snakemake-minimal=8
  - bioconductor-deseq2
  - bioconductor-apeglm
  - bioconductor-geoquery
  - bioconductor-org.hs.eg.db
  - bioconductor-enhancedvolcano
  - bioconductor-biocparallel
  - r-optparse
  - r-tidyverse
  - r-rcolorbrewer
  - r-pheatmap
  - r-ggrepel
